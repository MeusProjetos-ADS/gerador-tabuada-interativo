 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    
    <main>
        <h1>Gerador de Tabuada Interativo</h1>

        <div class="entrada-container">
            <p>Digite um número de 1 a 10:</p>

            <input type="number" id="numeroInput" min="1" max="10">
            <button id="calcularBtn">Calcular</button>
        </div>


        <div id="resultadoContainer">
        </div>
    </main>

    <script src="script.js"></script>
 </body>
 </html>
